version: "3"

# Mumbai (main-in) local development stack.
# Isolated from Ireland containers (rapidpro-postgres / rapidpro-valkey) by using different ports.
services:
  postgis:
    image: postgis/postgis:15-3.3-alpine
    container_name: rapidpro-mumbai-postgis
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: temba_in
      POSTGRES_USER: temba
      POSTGRES_PASSWORD: temba

  redis:
    image: redis:6.2-alpine
    container_name: rapidpro-mumbai-redis
    ports:
      - "6380:6379"
